name: 💡 Suggestion
description: An idea for a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the addon to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: Which problem does it solve for you or your guild?
