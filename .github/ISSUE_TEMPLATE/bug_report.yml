name: 🐞 Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the title of the /mg window or in /mg news.
      placeholder: e.g. 0.14.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open /mg
        2. Go to Events
        3. ...
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Turn on errors with /console scriptErrors 1, then paste the full text here.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
